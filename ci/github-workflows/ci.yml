name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    name: Frontend static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-frontend.mjs
      - run: shellcheck scripts/*.sh

  docker:
    name: Container builds and boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t epl-backend:ci .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8080:8080 -e SKIP_PREWARM=true epl-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ping; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1

  e2e:
    name: Browser regression (XSS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node scripts/e2e.mjs
