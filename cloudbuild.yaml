# Build + deploy the API to Cloud Run.
#   gcloud builds submit --config cloudbuild.yaml
#
# Secrets live in Secret Manager — never inline them here. One-time setup:
#   ./scripts/setup-secrets.sh
substitutions:
  _SERVICE: epl-backend
  _REGION: us-central1
  _REPO: epl
  _PUBLIC_BASE_URL: https://epl-prediction-app.web.app

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=2Gi
      - --cpu=2
      - --timeout=300
      - --min-instances=1
      - --max-instances=10
      - --set-env-vars=ENVIRONMENT=production,PUBLIC_BASE_URL=${_PUBLIC_BASE_URL},PAYFAST_SANDBOX=false
      - --set-secrets=GOOGLE_API_KEY=google-api-key:latest,PAYFAST_MERCHANT_ID=payfast-merchant-id:latest,PAYFAST_MERCHANT_KEY=payfast-merchant-key:latest,PAYFAST_PASSPHRASE=payfast-passphrase:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
