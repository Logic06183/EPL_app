name: Deploy Frontend to Firebase

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy static frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # frontend/ is plain static files (index.html, sw.js, manifest) —
      # no build step. Needs the FIREBASE_TOKEN repo secret.
      - name: Deploy to Firebase Hosting
        working-directory: ./frontend
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx --yes firebase-tools@13 deploy --only hosting --project epl-prediction-app --token "$FIREBASE_TOKEN"
